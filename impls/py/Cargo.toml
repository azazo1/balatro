[package]
name = "balatro-engine-py"
version = "0.1.0"
edition = "2024"
description = "balatro-engine 的 Python 绑定: 直接在对局状态上做搜索与批量试验."
license = "MIT"

[lib]
# 这个名字同时是 Python 侧的模块名 (见 src/lib.rs 的 #[pymodule]).
name = "balatro_engine"
crate-type = ["cdylib"]

[dependencies]
# 依赖别名保持 engine: 本 crate 自己的 lib 也叫 balatro_engine, 源码里用短名字更清楚.
engine = { path = "../engine/core", package = "balatro-engine-core" }
pyo3 = { version = "0.29", features = ["abi3-py38", "extension-module"] }

[profile.release]
# 搜索靠反复克隆状态, 慢一点都要乘以成千上万次, 所以速度优先.
opt-level = 3
lto = "thin"
