<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Balatro Modded</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e2b2d; overflow: hidden; }
    /* 画布在屏幕上始终铺满视口; 绘制缓冲另按屏幕像素密度放大 (见下面的 renderScale), 由浏览器缩回显示.
       用 important 是防 love 自己往 canvas 上写行内尺寸. */
    #canvas { display: block; width: 100vw !important; height: 100vh !important; visibility: hidden; outline: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              color: #fff; font: 20px sans-serif; text-align: center; white-space: pre-line; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status" role="status" aria-live="polite">加载中...</div>
  <script>
    var statusEl = document.getElementById("status");
    var canvas = document.getElementById("canvas");
    // 手机屏幕密度普遍是 2-3, 只按 CSS 像素开画布会糊一大截; 上限 2 是留一份性能余量.
    // ?res=1 可以关掉这个放大; 回放对拍只看状态, 固定按 1 渲染, 跑得快些.
    var renderScale = (function () {
      var params = new URLSearchParams(window.location.search);
      var asked = params.get("res");
      if (asked) return Math.max(1, parseFloat(asked) || 1);
      if (params.get("replay")) return 1;
      return Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    })();
    function fitCanvas() {
      canvas.width = Math.round(window.innerWidth * renderScale);
      canvas.height = Math.round(window.innerHeight * renderScale);
    }
    window.addEventListener("resize", fitCanvas);
    window.addEventListener("keydown", function (e) {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    });
    window.addEventListener("click", function () { canvas.focus(); });
    // F11 切全屏: 浏览器不支持 (例如 iOS Safari) 时不管, 交给浏览器自己.
    // 游戏自己的全屏入口是设置里的屏幕模式, 那条路由兼容层直接放行, 见 lua/boot.lua.
    (function () {
      var root = document.documentElement;
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!request || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) return;
      function current() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
      // 手机上进了全屏就顺手锁横屏: Balatro 是横屏游戏, 竖屏只剩中间一条.
      // 解不了锁 (iOS Safari, 或没给权限) 就不管.
      function syncOrientation() {
        var orientation = screen.orientation || screen.mozOrientation;
        if (!orientation || !orientation.lock) return;
        if (current()) { var lock = orientation.lock("landscape"); if (lock && lock.catch) lock.catch(function () { }); }
        else if (orientation.unlock) { try { orientation.unlock(); } catch (error) { } }
      }
      document.addEventListener("fullscreenchange", syncOrientation);
      document.addEventListener("webkitfullscreenchange", syncOrientation);
      window.addEventListener("keydown", function (e) {
        if (e.key !== "F11" && e.keyCode !== 122) return;
        e.preventDefault();
        if (current()) { if (exit) exit.call(document); return; }
        var started = request.call(root);
        if (started && started.catch) started.catch(function (error) { keepLog("[全屏]", ["进入全屏失败: " + error]); });
      });
    })();
    // 游戏里点退出时会把窗口标题换成记号 (见 lua/boot.lua), 盯到就回调试台.
    // 页面读不到游戏的文件系统, 标题是少有的两条路都通的通道.
    // 带 ?home=1 是让调试台落在开始页: 否则它会自动恢复上次的对局, 直接进棋盘.
    // 回放对拍时不跳: 那种场合页面是被脚本打开的, 退出只当结束.
    (function () {
      if (new URLSearchParams(window.location.search).get("replay")) return;
      setInterval(function () {
        if (document.title !== "balatro-web-quit") return;
        keepLog("[退出]", ["游戏已退出, 回调试台"]);
        window.location.href = "../?home=1";
      }, 250);
    })();
    // love.js 出错时会 alert, 模态框会卡住整个页面; 换成在页面上显示, 并保留最近的日志便于排查.
    window.__gameLogs = [];
    function keepLog(level, args) {
      var line = level + " " + Array.prototype.map.call(args, String).join(" ");
      window.__gameLogs.push(line);
      if (window.__gameLogs.length > 500) window.__gameLogs.shift();
      return line;
    }
    window.alert = function (msg) {
      keepLog("[alert]", [msg]);
      statusEl.style.display = "flex";
      statusEl.textContent = msg + "\n\n" + window.__gameLogs.slice(-15).join("\n");
    };
    var Module = {
      arguments: ["./"],
      INITIAL_MEMORY: __MEMORY__,
      print: function () { keepLog("[log]", arguments); console.log.apply(console, arguments); },
      printErr: function () { keepLog("[err]", arguments); console.error.apply(console, arguments); },
      canvas: canvas,
      setStatus: function (text) {
        if (text) {
          statusEl.textContent = text;
        } else if (Module.remainingDependencies === 0) {
          statusEl.style.display = "none";
          canvas.style.visibility = "visible";
          canvas.focus();
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "准备中... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
      }
    };
    // 页面要把几件事告诉 Lua 侧, 走 web_env.lua 这个文件 (os.getenv 由 web_compat/lang.lua 换掉):
    // - BALATRO_WEB_DPR: 屏幕像素密度, 游戏按它放大窗口, 见 lua/boot.lua.
    // - ?replay=<地址> 时再加上"命令行回放"那一套变量, 并把回放文件放进虚拟文件系统.
    (function () {
      var query = new URLSearchParams(window.location.search);
      var replay = query.get("replay");
      var env = { BALATRO_WEB_DPR: String(renderScale) };
      if (replay) {
        env.BALATROBOT_ENABLE = "1";
        env.BALATRO_SAVE_IDENTITY = "Balatro-Replay";
        env.BALATROBOT_REPLAY = "/replay.json";
        env.BALATROBOT_REPLAY_PACING = query.get("pacing") || "fast";
      }
      var lines = ["return {"];
      for (var key in env) lines.push('  ["' + key + '"]="' + env[key] + '",');
      lines.push("}");
      function writeFile(path, data) {
        if (Module.FS && Module.FS.writeFile) { Module.FS.writeFile(path, data); return; }
        Module.FS_createDataFile("/", path.slice(1), data, true, true);
      }
      Module.preRun = Module.preRun || [];
      Module.preRun.push(function () {
        writeFile("/web_env.lua", lines.join("\n"));
        if (!replay) return;
        Module.addRunDependency("replay");
        fetch(replay).then(function (response) {
          if (!response.ok) throw new Error(response.status + " " + response.statusText);
          return response.arrayBuffer();
        }).then(function (buffer) {
          writeFile(env.BALATROBOT_REPLAY, new Uint8Array(buffer));
          keepLog("[replay]", ["已载入 " + replay + " -> " + env.BALATROBOT_REPLAY]);
          Module.removeRunDependency("replay");
        }).catch(function (error) {
          keepLog("[replay]", ["载入失败: " + error]);
          Module.removeRunDependency("replay");
        });
      });
    })();
    canvas.addEventListener("webglcontextlost", function (e) {
      statusEl.style.display = "flex";
      statusEl.textContent = "WebGL 上下文丢失, 请刷新页面";
      e.preventDefault();
    });
    window.onerror = function (msg) {
      statusEl.style.display = "flex";
      statusEl.textContent = "出错了, 详见浏览器控制台\n" + msg;
    };
    fitCanvas();
    Module.setStatus("下载中...");
    function applicationLoad() { Love(Module); }
  </script>
  <script src="game.js"></script>
  <script async src="love.js" onload="applicationLoad()"></script>
</body>
</html>
