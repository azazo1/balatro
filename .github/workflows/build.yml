name: build

# 触发方式:
#   - push 到任意分支 / PR: 构建三个平台的产物, 上传 Actions artifact, 不创建 release
#   - push tag (v*): 校验版本后构建, 汇总产物, 创建或更新 GitHub Release
#   - 手动触发: tag 留空表示对当前 ref 跑 CI, 填写已有 tag 表示发布该 tag
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空表示只跑 CI"
        required: false
        type: string

# 同一个 ref 或 tag 的多次触发串行, 避免并发改动同一个 release.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 统一解析版本与检出目标: 后面所有 job 都依赖这里的结果, 保证 tag 发布构建的是 tag 本身.
  version:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.parse.outputs.is_release }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
      source_ref: ${{ steps.parse.outputs.source_ref }}
      version: ${{ steps.parse.outputs.version }}
      build_version: ${{ steps.parse.outputs.build_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析版本与目标 ref
        id: parse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          is_release=false
          tag_name=""
          source_ref="$EVENT_SHA"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            is_release=true
            tag_name="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_TAG:-}" ]; then
            is_release=true
            tag_name="$INPUT_TAG"
          fi

          if [ "$is_release" = "true" ]; then
            git check-ref-format "refs/tags/$tag_name" >/dev/null
            # tag 必须已存在, 否则在构建开始前就失败.
            git rev-parse --verify "refs/tags/$tag_name^{commit}" >/dev/null
            source_ref="refs/tags/$tag_name"
            version="${tag_name#v}"

            # tag 形如 <上游版本>-<仓库版本>, 例如 v1.0.1n-0.1.0.
            # 形如 v1.0.1n 的裸上游版本不允许, 因为它只能发布一次, 修了打包问题就没法再发.
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?[A-Za-z]*-[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag 格式不正确: $version"
              echo "应为 <上游版本>-<仓库版本>, 例如 v1.0.1n-0.1.0"
              exit 1
            fi

            # 校验上游版本部分与仓库中的版本文件一致, 挡住"打错版本"这类错误:
            # 例如游戏其实还是 1.0.1n, 却打了 v1.0.2-0.1.0.
            tag_upstream="${version%-*}"
            file_upstream="$(head -1 game/version.jkr | sed 's/-FULL$//')"
            if [ "$tag_upstream" != "$file_upstream" ]; then
              echo "::error::tag 中的上游版本与 game/version.jkr 不一致"
              echo "  tag: $tag_upstream  文件: $file_upstream"
              echo "如需发布新的游戏版本, 先把新的游戏资源更新进 game/ 并提交"
              exit 1
            fi
            build_version="$version"
          else
            # 非发布构建用上游版本加短 hash, 便于区分同版本的不同提交, 且与发布版本形式上可区分.
            file_upstream="$(head -1 game/version.jkr | sed 's/-FULL$//')"
            short="$(git rev-parse --short=7 "$EVENT_SHA")"
            version=""
            build_version="${file_upstream}+${short}"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

          {
            echo "### 版本解析"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 是否发布 | $is_release |"
            echo "| tag | ${tag_name:-（无）} |"
            echo "| 检出目标 | $source_ref |"
            echo "| 版本 | ${version:-（非发布）} |"
            echo "| 构建版本 | $build_version |"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: version
    # macos-15 是 arm64 的标准 runner; 同规格的 x64 版本写作 macos-15-intel.
    # 产物与 runner 架构无关: vendor 里的 love.app 本就是通用二进制, 游戏资源是 Lua,
    # 因此两种架构产出的应用包都是通用二进制, 不存在只支持单一架构的问题.
    # 保留 arm64 是因为它是当前默认规格, 而 Intel 标准 runner 正在逐步退役
    # (macOS 14 的 Intel 规格已被移除). 若 arm64 排队过久, 换成 macos-15-intel 即可.
    # 注意 macos-15-large 与 macos-15-xlarge 属于付费的大规格 runner, 不要误用.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [vanilla, modded]
    env:
      # 原版与带 mod 的版本并行构建, 产物名以前缀区分.
      MODS_FLAG: ${{ matrix.flavor == 'modded' && '--mods mods' || '' }}
      APP_STEM: ${{ matrix.flavor == 'modded' && 'Balatro-Modded' || 'Balatro' }}
      ARTIFACT_PREFIX: ${{ matrix.flavor == 'modded' && 'balatro-modded' || 'balatro' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      # 带 mod 的包在打包时编译 bbnet (runner 预装了 rustup 与 arm64 的 target), 这里只缓存编译结果.
      - uses: Swatinem/rust-cache@v2
        if: matrix.flavor == 'modded'
        with:
          workspaces: native/bbnet

      - name: 打包
        shell: bash
        env:
          PROJECT_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: python3 scripts/package_macos.py $MODS_FLAG

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          app="dist/macos/${APP_STEM}.app"
          test -d "$app/Contents/MacOS"
          test -x "$app/Contents/MacOS/love"
          test -f "$app/Contents/Resources/Balatro.love"
          test -f "$app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "$app"
          if [ -n "$MODS_FLAG" ]; then
            listing="$(unzip -l "$app/Contents/Resources/Balatro.love")"
            grep -q "lovely_shim/manifest.lua" <<< "$listing"
            # 只带本平台的原生库: 缺了内置 agent 没有流式请求, 多了说明别的平台的库混了进来.
            native="$(grep -o 'lovely_shim/mods/balatrobot/native/.*' <<< "$listing" || true)"
            if [ "$native" != "lovely_shim/mods/balatrobot/native/macos/libbbnet.dylib" ]; then
              echo "::error::原生库不对: ${native:-没有原生库}"
              exit 1
            fi
          fi
          # 产物名去掉 v 前缀, 与其它平台保持一致.
          version="${{ needs.version.outputs.build_version }}"
          echo "ARTIFACT_NAME=${ARTIFACT_PREFIX}-${version}-macos-universal" >> "$GITHUB_ENV"

      - name: 归档
        shell: bash
        run: |
          set -euo pipefail
          # 用 ditto 打包可以保留 .app 内的符号链接与扩展属性.
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/macos/${APP_STEM}.app" "dist/${ARTIFACT_NAME}.zip"
          shasum -a 256 "dist/${ARTIFACT_NAME}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [vanilla, modded]
    env:
      # 带 mod 的版本使用独立包名, 与原版可同时安装; 签名密钥两者共用.
      MODS_FLAG: ${{ matrix.flavor == 'modded' && '--mods mods' || '' }}
      APP_STEM: ${{ matrix.flavor == 'modded' && 'Balatro-Modded' || 'Balatro' }}
      ARTIFACT_PREFIX: ${{ matrix.flavor == 'modded' && 'balatro-modded' || 'balatro' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 确认 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # runner 镜像已预装 Android SDK 与多个版本的 build-tools, 因此不安装任何组件.
          # 尤其不要用 android-actions/setup-android: 它默认要装 "tools" 包, 而该包已从
          # SDK 仓库移除, 会让 action 自身以非零退出的方式失败.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk/build-tools" ]; then
            echo "::error::$sdk 下没有 build-tools"
            ls -la "$sdk" || true
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          bt="$(find "$sdk/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "使用 build-tools: $(basename "$bt")"
          test -x "$bt/apksigner" || { echo "::error::缺少 apksigner"; exit 1; }
          test -x "$bt/zipalign" || { echo "::error::缺少 zipalign"; exit 1; }

      # 带 mod 的包在打包时用 cargo-ndk 编译 bbnet. runner 预装了 rustup 和 NDK (ANDROID_NDK_HOME 已设好),
      # 缺的是 Android 的 rust target 与 cargo-ndk. 缓存放在 target 之前恢复, ~/.cargo/bin 里的 cargo-ndk 也在其中.
      - uses: Swatinem/rust-cache@v2
        if: matrix.flavor == 'modded'
        with:
          workspaces: native/bbnet

      - name: 准备 bbnet 工具链
        if: matrix.flavor == 'modded'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          # 版本钉死, 免得上游发版改了参数或输出布局. 已在缓存里时跳过编译.
          if [ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          cargo ndk --version

      - name: 写入签名密钥
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64, 无法签名 Android 产物"
            exit 1
          fi
          mkdir -p dist/android
          echo "$KEYSTORE_BASE64" | base64 -d > dist/android/balatro.keystore

      - name: 打包
        shell: bash
        env:
          PROJECT_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BALATRO_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          python3 scripts/package_android.py $MODS_FLAG \
            --keystore dist/android/balatro.keystore \
            --key-alias "${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.build_version }}"
          apk="dist/android/${APP_STEM}-${version}.apk"
          test -f "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/zipalign" -c 4 "$apk"
          # 确认游戏负载确实在归档里, 而不是只打出一个空壳.
          unzip -l "$apk" | grep -q "assets/game.love"
          if [ -n "$MODS_FLAG" ]; then
            unzip -p "$apk" assets/game.love > /tmp/game.love
            unzip -l /tmp/game.love | grep -q "lovely_shim/manifest.lua"
            # bbnet 放在 APK 的 lib/ 下: 缺了内置 agent 连不上模型, 录像也拿不到 mp4, 而游戏照常启动.
            unzip -l "$apk" | grep -q "lib/arm64-v8a/libbbnet.so" \
              || { echo "::error::APK 里没有 lib/arm64-v8a/libbbnet.so"; exit 1; }
            # 游戏负载里不该有任何原生库 (桌面的库混进来只会白占空间).
            if unzip -l /tmp/game.love | grep -q "lovely_shim/mods/balatrobot/native/"; then
              echo "::error::游戏负载里混进了原生库"
              exit 1
            fi
          fi
          name="${ARTIFACT_PREFIX}-${version}-android-arm64"
          cp "$apk" "dist/${name}.apk"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        flavor: [vanilla, modded]
    env:
      MODDED: ${{ matrix.flavor == 'modded' && '1' || '' }}
      APP_STEM: ${{ matrix.flavor == 'modded' && 'Balatro-Modded' || 'Balatro' }}
      ARTIFACT_PREFIX: ${{ matrix.flavor == 'modded' && 'balatro-modded' || 'balatro' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      # 带 mod 的包在打包时编译 bbnet.dll (runner 预装了 rustup 与 MSVC), 这里只缓存编译结果.
      # 产物校验 (verify_windows_bundle.py --modded) 会确认 dll 进了游戏负载.
      - uses: Swatinem/rust-cache@v2
        if: matrix.flavor == 'modded'
        with:
          workspaces: native/bbnet

      - name: 打包
        shell: pwsh
        env:
          PROJECT_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extra = @()
          if ($env:MODDED) { $extra = @('--mods', 'mods') }
          python scripts/package_windows.py @extra
          if ($LASTEXITCODE) { throw '打包失败' }

      - name: 校验并重命名产物
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 产物目录名由版本推导, 这里用 glob 查找, 不写死版本号.
          # 原版目录形如 Balatro-<版本>-win64, 需排除 Balatro-Modded-* 以免误选.
          $dir = Get-ChildItem -LiteralPath 'dist/windows' -Directory |
            Where-Object { $_.Name -like "${env:APP_STEM}-*-win64" -and
                           ($env:MODDED -or $_.Name -notlike 'Balatro-Modded-*') } |
            Select-Object -First 1
          if (-not $dir) { throw '未找到 Windows 产物目录' }

          # 校验逻辑放在仓库脚本里, 本机与 CI 共用同一份实现.
          $verify = @($dir.FullName)
          if ($env:MODDED) { $verify = @('--modded') + $verify }
          python scripts/verify_windows_bundle.py @verify
          if ($LASTEXITCODE) { throw '产物校验失败' }

          $src = Join-Path 'dist/windows' "$($dir.Name).zip"
          if (-not (Test-Path -LiteralPath $src)) { throw "缺少 $src" }
          $name = "${env:ARTIFACT_PREFIX}-${env:BUILD_VERSION}-windows-x86_64"
          Move-Item -LiteralPath $src -Destination "dist/${name}.zip" -Force
          "ARTIFACT_NAME=${name}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    # 只有 tag 发布才创建 release, 并且必须等全部平台构建通过.
    if: needs.version.outputs.is_release == 'true'
    needs: [version, macos, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: 校验发布说明
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          notes="docs/changelog/${VERSION}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::缺少发布说明 $notes"
            exit 1
          fi
          # 精确拉取 tag 对象, 确认它是 annotated tag 且正文与说明文件一致.
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          type="$(git cat-file -t "refs/tags/${TAG_NAME}")"
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG_NAME 不是 annotated tag (类型为 $type)"
            exit 1
          fi
          git tag -l --format='%(contents)' "$TAG_NAME" > /tmp/tag-body.txt
          if ! diff -q <(sed -e '$a\' "$notes") <(sed -e '$a\' /tmp/tag-body.txt) >/dev/null; then
            echo "::error::tag 正文与 $notes 不一致"
            diff -u <(sed -e '$a\' "$notes") <(sed -e '$a\' /tmp/tag-body.txt) || true
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: 汇总产物与校验和
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p upload
          count=0
          for f in artifacts/*; do
            case "$f" in
              *.zip|*.apk) cp "$f" upload/; count=$((count + 1)) ;;
              *) echo "::error::意外的产物: $f"; exit 1 ;;
            esac
          done
          # 三个平台各有原版与带 mod 两个产物, 数量不对说明有 job 静默漏传.
          if [ "$count" -ne 6 ]; then
            echo "::error::产物数量为 $count, 期望 6"
            ls -la artifacts || true
            exit 1
          fi
          ( cd upload && sha256sum ./* > SHA256SUMS )
          cat upload/SHA256SUMS

      - name: 创建或更新 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          title="Balatro v${VERSION}"
          notes="docs/changelog/${VERSION}.md"
          # 生成的 notes 作为补充追加在人工说明之后.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${TAG_NAME}" -f "target_commitish=$(git rev-parse HEAD)" \
            --jq '.body' > /tmp/generated.md || echo "（未能生成补充说明）" > /tmp/generated.md
          {
            sed -e '$a\' "$notes"
            echo ""
            echo "---"
            echo ""
            cat /tmp/generated.md
          } > /tmp/release-body.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$title" --notes-file /tmp/release-body.md
            gh release upload "$TAG_NAME" upload/* --clobber
          else
            gh release create "$TAG_NAME" upload/* \
              --verify-tag --title "$title" --notes-file /tmp/release-body.md
          fi
